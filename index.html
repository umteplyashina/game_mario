<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Супер Человечек</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap&subset=cyrillic,latin" rel="stylesheet" />
</head>
<body>
  <div class="wrap">
    <h1>Супер Человечек</h1>
    <div class="stage">
      <canvas id="game" width="960" height="540"></canvas>
      <div class="touch" id="touch">
        <div class="touch-left">
          <button type="button" data-key="ArrowLeft">◀</button>
          <button type="button" data-key="ArrowRight">▶</button>
        </div>
        <button type="button" class="jump" data-key="ArrowUp">ПРЫЖОК</button>
      </div>
    </div>
    <p class="hint">Стрелки / WASD — ходьба · Пробел или ↑ — прыжок · Головой бей блоки с «?»</p>
  </div>
  <script src="game.js"></script>
</body>
</html>
